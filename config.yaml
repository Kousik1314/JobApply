# ---------------------------------------------------------------- AI (optional)
# Without OPENAI_API_KEY the system still runs using rules only (no scores or drafts).
llm:
  classify_model: gpt-5.4-mini     # falls back to draft_model if unavailable
  draft_model: gpt-5.4
  min_score: 55                    # jobs scored below this are hidden
  draft_min_score: 70              # drafts are written for jobs scoring at least this
  max_drafts_per_run: 30
  note_chars: 200                  # LinkedIn free-account connection note limit
